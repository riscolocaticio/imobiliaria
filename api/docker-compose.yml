services:
  postgres:
    image: postgres:17
    container_name: postgres-risco-locaticio
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: risco_locaticio

    ports:
      - "5442:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
